# Publishes to npm when a version tag (e.g. v1.0.1) is pushed.
# Uses npm trusted publishing (OIDC) — no tokens. Configure once on npmjs.com:
# package settings → Trusted publisher → GitHub Actions → akashi-video/akashi-verify, workflow publish.yml.
name: Publish
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - run: npm publish --provenance --access public
